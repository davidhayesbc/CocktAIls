name: CocktAIls Preview Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cocktails-preview-release
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Require trusted main dispatch and exact-SHA Android CI success
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject non-main refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Preview releases can only be dispatched from the trusted main branch.'
            exit 1
          fi

      - name: Wait for successful Android CI on this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_preview_ci_gate.py'
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            response="$(gh api \
              -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/android-ci.yml/runs" \
              -f "head_sha=$GITHUB_SHA" \
              -f 'event=push' \
              -f 'per_page=100')"
            result="$(python3 .github/scripts/preview_ci_gate.py "$GITHUB_SHA" <<< "$response")"
            state="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$result")"
            run_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<< "$result")"
            if [[ "$state" == missing ]]; then
              echo "Android CI has not started for $GITHUB_SHA; checking again."
            elif [[ "$state" == success ]]; then
              echo "Verified successful Android CI run: $run_url"
              exit 0
            elif [[ "$state" == failure ]]; then
              echo "::error::Android CI for $GITHUB_SHA completed unsuccessfully: $run_url"
              exit 1
            elif [[ "$state" == pending ]]; then
              echo "Android CI for $GITHUB_SHA is still queued or running: $run_url"
            else
              echo "::error::Unexpected Android CI gate state '$state'."
              exit 1
            fi
            sleep 20
          done
          echo "::error::No successful completed Android CI run for exact commit $GITHUB_SHA within 30 minutes."
          exit 1

  prepare-preview:
    name: Verify and sign the preview APK
    needs: validate-dispatch
    outputs:
      preview_artifact_name: ${{ steps.preview-artifact.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Require configured preview signing key
        shell: bash
        env:
          COCKTAILS_PREVIEW_KEYSTORE_BASE64: ${{ secrets.COCKTAILS_PREVIEW_KEYSTORE_BASE64 }}
          COCKTAILS_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.COCKTAILS_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${COCKTAILS_PREVIEW_KEYSTORE_BASE64:-}" || -z "${COCKTAILS_PREVIEW_KEYSTORE_PASSWORD:-}" ]]; then
            echo '::error::Configure the approved preview keystore and password repository secrets before dispatching this workflow.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Set preview build identity
        shell: bash
        run: echo "COCKTAILS_VERSION_NAME=0.1.0-preview.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Run checks and build the exact commit
        run: ./gradlew --no-daemon :shared:core:compileCommonMainKotlinMetadata :shared:core:testDebugUnitTest :apps:androidApp:compileDebugAndroidTestKotlin :apps:androidApp:lintDebug :shared:core:lintDebug :apps:androidApp:assembleDebug

      - name: Sign and verify APK with the persistent preview certificate
        shell: bash
        env:
          COCKTAILS_PREVIEW_KEYSTORE_BASE64: ${{ secrets.COCKTAILS_PREVIEW_KEYSTORE_BASE64 }}
          COCKTAILS_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.COCKTAILS_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/cocktails-preview.p12"
          aligned_apk="$RUNNER_TEMP/cocktails-preview-aligned.apk"
          signed_apk="$RUNNER_TEMP/CocktAIls-preview.apk"
          output_dir="$RUNNER_TEMP/preview-release"
          cert_report="$RUNNER_TEMP/cocktails-preview-apk-cert.txt"
          mkdir -p "$output_dir"
          trap 'rm -f "$keystore" "$aligned_apk" "$cert_report"' EXIT

          printf '%s' "$COCKTAILS_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          unset COCKTAILS_PREVIEW_KEYSTORE_BASE64

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/zipalign" -f -p 4 \
            apps/androidApp/build/outputs/apk/debug/androidApp-debug.apk "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias cocktails-preview \
            --ks-pass env:COCKTAILS_PREVIEW_KEYSTORE_PASSWORD \
            --key-pass env:COCKTAILS_PREVIEW_KEYSTORE_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk" > "$cert_report"

          apk_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$cert_report" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          keystore_cert="$(keytool -exportcert \
            -alias cocktails-preview \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass:env COCKTAILS_PREVIEW_KEYSTORE_PASSWORD 2>/dev/null | sha256sum | awk '{print $1}')"
          if [[ -z "$apk_cert" || "$apk_cert" != "$keystore_cert" ]]; then
            echo '::error::The APK signer certificate did not match the configured preview keystore.'
            exit 1
          fi

          cp "$signed_apk" "$output_dir/CocktAIls-preview.apk"
          sha256sum "$output_dir/CocktAIls-preview.apk" \
            | awk '{print $1 "  CocktAIls-preview.apk"}' > "$output_dir/SHA256SUMS.txt"
          {
            echo "Preview version: $COCKTAILS_VERSION_NAME"
            echo "Source commit: $GITHUB_SHA"
            echo "Package: com.davidhayesbc.cocktails"
            echo 'Minimum Android version: API 26 (Android 8.0)'
            echo "Signing certificate SHA-256: $apk_cert"
            echo 'This is a debug-build preview for sideload testing, not a production or Play Store release.'
            echo 'Back up or export household data before installing this first persistently signed preview. It must replace an APK installed with a different debug certificate; future previews signed with this same key can update in place.'
          } > "$output_dir/RELEASE_NOTES.md"

      - name: Set unique artifact identity for this workflow attempt
        id: preview-artifact
        shell: bash
        run: echo "name=CocktAIls-signed-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload verified signed preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.preview-artifact.outputs.name }}
          path: ${{ runner.temp }}/preview-release/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-preview:
    name: Publish the verified GitHub prerelease
    needs: prepare-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified preview files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare-preview.outputs.preview_artifact_name }}
          path: ${{ runner.temp }}/preview-release

      - name: Install Android APK verification tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then sdkmanager_path="$(command -v sdkmanager)"; fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install 'build-tools;36.0.0'

      - name: Create the public prerelease
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: preview-v0.1.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_preview_release_gate.py'
          api="repos/$GITHUB_REPOSITORY"
          tag_ref="$RUNNER_TEMP/release-tag-ref.json"
          tag_error="$RUNNER_TEMP/release-tag-error.txt"
          if gh api "$api/git/ref/tags/$RELEASE_TAG" > "$tag_ref" 2> "$tag_error"; then
            object_type="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["type"])' "$tag_ref")"
            object_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["object"]["sha"])' "$tag_ref")"
            if [[ "$object_type" == tag ]]; then
              object_sha="$(gh api "$api/git/tags/$object_sha" --jq '.object.sha')"
            fi
            if [[ "$object_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG resolves to $object_sha, not this workflow's commit $GITHUB_SHA. Refusing to move it."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$tag_error"; then
            cat "$tag_error"
            echo '::error::Could not safely determine whether the preview tag already exists.'
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          existing_release="$RUNNER_TEMP/existing-release"
          mkdir -p "$existing_release"
          release_json="$RUNNER_TEMP/release-verification.json"
          release_error="$RUNNER_TEMP/release-api-error.txt"
          if gh api "$api/releases/tags/$RELEASE_TAG" > "$release_json" 2> "$release_error"; then
            release_state="$(python3 .github/scripts/preview_release_gate.py 200 "$GITHUB_SHA" < "$release_json")"
          elif grep -q 'HTTP 404' "$release_error"; then
            release_state="$(python3 .github/scripts/preview_release_gate.py 404 "$GITHUB_SHA" <<< '{}')"
          else
            cat "$release_error"
            echo '::error::Could not safely determine whether the preview release already exists.'
            exit 1
          fi
          state="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$release_state")"
          if [[ "$state" == mismatch ]]; then
            echo '::error::A release with this tag exists but does not match the expected commit or required assets.'
            exit 1
          elif [[ "$state" == error ]]; then
            echo '::error::GitHub returned an unexpected release lookup result.'
            exit 1
          elif [[ "$state" == existing ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'CocktAIls-preview.apk' --pattern 'SHA256SUMS.txt' --pattern 'RELEASE_NOTES.md' \
              --dir "$existing_release"
            (cd "$existing_release" && sha256sum --check SHA256SUMS.txt)
            existing_cert="$("$build_tools/apksigner" verify --verbose --print-certs "$existing_release/CocktAIls-preview.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
            expected_cert="$(sed -n 's/^Signing certificate SHA-256: //p' "$RUNNER_TEMP/preview-release/RELEASE_NOTES.md" | head -n 1 | tr '[:upper:]' '[:lower:]')"
            existing_source="$(sed -n 's/^Source commit: //p' "$existing_release/RELEASE_NOTES.md" | head -n 1)"
            [[ -n "$existing_cert" && "$existing_cert" == "$expected_cert" && "$existing_source" == "$GITHUB_SHA" ]] || {
              echo '::error::Existing release APK signature or source commit does not match the freshly verified preview.'
              exit 1
            }
            echo "Verified existing preview release without replacing assets: $(python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<< "$release_state")"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/preview-release/CocktAIls-preview.apk" \
            "$RUNNER_TEMP/preview-release/SHA256SUMS.txt" \
            "$RUNNER_TEMP/preview-release/RELEASE_NOTES.md" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CocktAIls Preview $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/preview-release/RELEASE_NOTES.md" \
            --prerelease
          gh api "$api/releases/tags/$RELEASE_TAG" > "$release_json"
          release_state="$(python3 .github/scripts/preview_release_gate.py 200 "$GITHUB_SHA" < "$release_json")"
          state="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<< "$release_state")"
          [[ "$state" == existing ]] || {
            echo '::error::Published release metadata does not match this commit or lacks required assets.'
            exit 1
          }
          echo "Verified public prerelease URL: $(python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<< "$release_state")"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'CocktAIls-preview.apk' --pattern 'SHA256SUMS.txt' --pattern 'RELEASE_NOTES.md' \
            --dir "$existing_release"
          (cd "$existing_release" && sha256sum --check SHA256SUMS.txt)
          actual_cert="$("$build_tools/apksigner" verify --verbose --print-certs "$existing_release/CocktAIls-preview.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(sed -n 's/^Signing certificate SHA-256: //p' "$RUNNER_TEMP/preview-release/RELEASE_NOTES.md" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual_cert" && "$actual_cert" == "$expected_cert" ]] || {
            echo '::error::Published APK certificate verification failed.'
            exit 1
          }
