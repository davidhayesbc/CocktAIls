name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify shared core and package Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-35;default;x86_64'

      - name: Start Android SDK emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/cocktails-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name cocktails-ci --package 'system-images;android-35;default;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd cocktails-ci -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel auto -no-snapshot -no-metrics > "$RUNNER_TEMP/cocktails-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cocktails-emulator.pid"
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              "$ANDROID_HOME/platform-tools/adb" shell svc wifi disable
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/cocktails-emulator.log"
          exit 1

      - name: Set build identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "COCKTAILS_VERSION_NAME=0.1.0-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Run shared-core tests and build Android APK
        run: ./gradlew --no-daemon :shared:core:compileCommonMainKotlinMetadata :shared:core:testDebugUnitTest :apps:androidApp:connectedDebugAndroidTest :apps:androidApp:lintDebug :shared:core:lintDebug :apps:androidApp:assembleDebug

      - name: Upload debug APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CocktAIls-debug-v0.1.0-ci-${{ github.run_number }}-${{ github.sha }}
          path: apps/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
