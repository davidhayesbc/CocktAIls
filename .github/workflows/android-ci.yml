name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify shared core and package Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test preview workflow gate helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_preview_*.py'

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Set build identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "COCKTAILS_VERSION_NAME=0.1.0-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Run shared-core tests, Android checks, and package APK
        run: ./gradlew --no-daemon :shared:core:compileCommonMainKotlinMetadata :shared:core:testDebugUnitTest :apps:androidApp:compileDebugAndroidTestKotlin :apps:androidApp:lintDebug :shared:core:lintDebug :apps:androidApp:assembleDebug

      - name: Upload debug APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CocktAIls-debug-v0.1.0-ci-${{ github.run_number }}-${{ github.sha }}
          path: apps/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  emulator-smoke:
    name: Android offline launch and persistence smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure writable Android user directories
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/cocktails-android-user" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/cocktails-android-user" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/cocktails-avd" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android" \
            "$RUNNER_TEMP/cocktails-android-user" \
            "$RUNNER_TEMP/cocktails-avd"
          chmod 700 "$HOME/.android" "$RUNNER_TEMP/cocktails-android-user"

      - name: Install Android emulator packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-35;default;x86_64'

      - name: Create AVD and start adb before emulator
        shell: bash
        run: |
          set -euo pipefail
          # adb stores its authentication key under $HOME/.android on Linux.
          # Create that directory explicitly as well as the SDK user home used
          # by the emulator tools so adb can initialize without a permission change.
          mkdir -p "$HOME/.android" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME"
          chmod 700 "$HOME/.android"
          chmod 700 "$ANDROID_USER_HOME"
          avdmanager_log="$RUNNER_TEMP/cocktails-avdmanager.log"
          if ! timeout 120 "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name cocktails-ci --package 'system-images;android-35;default;x86_64' --device pixel_2 \
            <<< 'no' > "$avdmanager_log" 2>&1; then
            echo 'AVD creation failed or exceeded its 120-second limit.'
            tail -n 250 "$avdmanager_log" || true
            exit 1
          fi

          # The hosted runner uses software rendering. Keep the virtual display
          # modest so Android's first-boot SystemServer work is less CPU-bound.
          avd_config="$ANDROID_AVD_HOME/cocktails-ci.avd/config.ini"
          cat >> "$avd_config" <<'EOF'
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=320
          hw.ramSize=2048
          hw.cpu.ncore=2
          EOF

          adb="$ANDROID_HOME/platform-tools/adb"
          adb_bootstrap_log="$RUNNER_TEMP/cocktails-adb-bootstrap.log"
          if ! timeout 30 "$adb" start-server > "$adb_bootstrap_log" 2>&1; then
            echo 'adb server failed to start within 30 seconds.'
            cat "$adb_bootstrap_log" || true
            exit 1
          fi
          timeout 15 "$adb" devices -l | tee -a "$adb_bootstrap_log"

          emulator_log="$RUNNER_TEMP/cocktails-emulator.log"
          emulator_pid_file="$RUNNER_TEMP/cocktails-emulator.pid"
          nohup "$ANDROID_HOME/emulator/emulator" -avd cocktails-ci -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel off -no-snapshot -no-metrics \
            > "$emulator_log" 2>&1 < /dev/null &
          emulator_pid="$!"
          echo "$emulator_pid" > "$emulator_pid_file"

          # Software emulation can be slow on hosted runners. Bound both device
          # registration and Android boot, and stop early if the emulator exits.
          device_deadline=$((SECONDS + 300))
          until timeout 10 "$adb" devices | awk '$1 == "emulator-5554" && $2 == "device" { found=1 } END { exit !found }'; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator process $emulator_pid exited before registering with adb."
              tail -n 250 "$emulator_log" || true
              exit 1
            fi
            if (( SECONDS >= device_deadline )); then
              echo "Emulator did not register as a device within 300 seconds."
              "$adb" devices -l || true
              tail -n 250 "$emulator_log" || true
              exit 1
            fi
            sleep 5
          done

          # Cold boot on software emulation can take several minutes. Keep the
          # wait bounded but allow the system-server startup seen on CI runners.
          boot_deadline=$((SECONDS + 600))
          until [[ "$(timeout 10 "$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator process $emulator_pid exited during Android boot."
              tail -n 250 "$emulator_log" || true
              exit 1
            fi
            if (( SECONDS >= boot_deadline )); then
              echo "Android did not report boot completion within 600 seconds."
              "$adb" devices -l || true
              tail -n 250 "$emulator_log" || true
              exit 1
            fi
            sleep 5
          done
          timeout 10 "$adb" -s emulator-5554 shell svc wifi disable

      - name: Prepare connected instrumentation APKs
        run: ./gradlew --no-daemon :apps:androidApp:assembleDebug :apps:androidApp:assembleDebugAndroidTest

      - name: Run offline launch and persistence smoke test
        run: timeout 900 ./gradlew --no-daemon :apps:androidApp:connectedDebugAndroidTest

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb="$ANDROID_HOME/platform-tools/adb"
          echo '--- adb devices ---'
          timeout 10 "$adb" devices -l
          echo '--- emulator process ---'
          if [[ -f "$RUNNER_TEMP/cocktails-emulator.pid" ]]; then
            emulator_pid="$(cat "$RUNNER_TEMP/cocktails-emulator.pid")"
            ps -p "$emulator_pid" -o pid,stat,args
          fi
          echo '--- adb processes ---'
          pgrep -af 'adb|emulator' | head -n 40
          echo '--- emulator log (last 300 lines) ---'
          tail -n 300 "$RUNNER_TEMP/cocktails-emulator.log"
          echo '--- emulator logcat (last 3000 lines) ---'
          timeout 30 "$adb" -s emulator-5554 logcat -d -t 3000 > "$RUNNER_TEMP/cocktails-logcat.log" 2>&1
          tail -n 300 "$RUNNER_TEMP/cocktails-logcat.log"
          echo '--- AVD manager log (last 300 lines) ---'
          tail -n 300 "$RUNNER_TEMP/cocktails-avdmanager.log"
          echo '--- adb bootstrap log (last 100 lines) ---'
          tail -n 100 "$RUNNER_TEMP/cocktails-adb-bootstrap.log"
          echo '--- permission prompt screenshots ---'
          for screenshot in /sdcard/Android/data/com.davidhayesbc.cocktails/cache/camera-permission-*.png; do
            [[ -f "$screenshot" ]] || continue
            timeout 15 "$adb" pull "$screenshot" "$RUNNER_TEMP/$(basename "$screenshot")"
          done

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CocktAIls-emulator-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cocktails-emulator.log
            ${{ runner.temp }}/cocktails-emulator.pid
            ${{ runner.temp }}/cocktails-logcat.log
            ${{ runner.temp }}/cocktails-avdmanager.log
            ${{ runner.temp }}/cocktails-adb-bootstrap.log
            ${{ runner.temp }}/camera-permission-*.png
            apps/androidApp/build/outputs/androidTest-results/connected/**/*.xml
            apps/androidApp/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop emulator and adb
        if: always()
        shell: bash
        run: |
          set +e
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 10 "$adb" -s emulator-5554 emu kill
          if [[ -f "$RUNNER_TEMP/cocktails-emulator.pid" ]]; then
            emulator_pid="$(cat "$RUNNER_TEMP/cocktails-emulator.pid")"
            for _ in $(seq 1 15); do
              kill -0 "$emulator_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill "$emulator_pid" 2>/dev/null || true
            fi
          fi
          timeout 10 "$adb" kill-server
